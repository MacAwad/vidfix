<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>VidFix</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="../icons/icon32.png" alt="" width="24" height="24">
    <div class="titles">
      <div class="title">VidFix</div>
      <div id="site" class="site"></div>
    </div>
    <label class="switch" title="Turn VidFix on or off for this site">
      <input type="checkbox" id="siteToggle">
      <span class="slider"></span>
    </label>
  </header>
  <main id="main"></main>
  <footer>
    <button id="opts" class="link">Settings and shortcuts</button>
    <span class="keys">Hover a video: K pause · J/L seek · S/D speed</span>
  </footer>
  <script src="../src/shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
