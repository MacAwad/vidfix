<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>VidFix</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="../icons/icon32.png" alt="" width="22" height="22">
    <div class="title">VidFix</div>
    <label class="switch" title="Turn VidFix on or off for this site">
      <input type="checkbox" id="siteToggle">
      <span class="slider"></span>
    </label>
  </header>
  <div id="site" class="site"></div>
  <main id="list"></main>
  <footer>
    <button id="opts" class="link">Settings and shortcuts</button>
  </footer>
  <script src="../src/shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
