<!DOCTYPE html><html><head><title>News clip</title><script src="/hls.js"></script></head><body style="margin:0;padding:20px">
<h3>HLS with TS segments</h3>
<video id="v" playsinline muted style="width:640px;height:360px;background:#000"></video>
<script>const v=document.getElementById('v'); const h=new Hls(); h.loadSource('/hls_ts/index.m3u8'); h.attachMedia(v); h.on(Hls.Events.MANIFEST_PARSED,()=>{window.ready=true});</script>
</body></html>
