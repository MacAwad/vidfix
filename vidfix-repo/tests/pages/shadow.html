<!DOCTYPE html><html><head><title>Reddit-style shadow DOM player</title></head><body style="margin:0;padding:20px;font-family:sans-serif">
<h3>Video inside shadow DOM (like Reddit) + iframe embed</h3>
<shreddit-player id="sp" style="display:block;width:640px;height:360px"></shreddit-player>
<script>
const host = document.getElementById('sp'); const root = host.attachShadow({mode:'open'});
root.innerHTML = '<div style="position:relative;width:640px;height:360px"><video src="/media/progressive.mp4" muted playsinline style="width:640px;height:360px;background:#000"></video><div style="position:absolute;inset:0"></div></div>';
</script>
<p>Embedded player:</p>
<iframe src="/p/strict-direct.html" style="width:720px;height:460px;border:1px solid #ccc"></iframe>
<div style="height:1500px"></div></body></html>
