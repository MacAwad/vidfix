<!DOCTYPE html><html><head><title>Player that resets speed</title></head><body style="margin:0;padding:20px">
<video id="v" src="/media/progressive.mp4" muted playsinline style="width:640px;height:360px"></video>
<script>const v=document.getElementById('v'); v.addEventListener('pause',()=>{v.playbackRate=1}); v.addEventListener('seeked',()=>{v.playbackRate=1});</script>
</body></html>
