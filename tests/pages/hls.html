<!DOCTYPE html><html><head><title>Post on X</title><script src="/hls.js"></script>
<style>body{font-family:sans-serif;margin:0;padding:20px}</style></head><body>
<h3>X-style HLS: fMP4 with separate audio (hls.js)</h3>
<video id="v" playsinline muted style="width:640px;height:360px;background:#000"></video>
<script>const v=document.getElementById('v'); const h=new Hls(); h.loadSource('/hls_fmp4/master.m3u8'); h.attachMedia(v); h.on(Hls.Events.MANIFEST_PARSED,()=>{window.ready=true});</script>
<div style="height:1500px"></div></body></html>
